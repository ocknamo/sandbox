<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>推理ゲーム</title>
    <style>
      /* The palette and the page frame are global: they belong to the document
         rather than to any one component, and the light/dark choice has to
         apply before the first paint. Component styling lives in styles.ts. */
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --fg: #1c1b19;
        --muted: #6b6862;
        --line: #e2ded5;
        --card: #ffffff;
        --accent: #2f6f4f;
        --warn: #a4562a;
        --bar: #d9d4c8;
        /* The notebook: a leather cover and the paper inside it. */
        --leather: #8b2e1f;
        --leather-ink: #8b2e1f;
        --stitch: #efc79c;
        --paper: #fbf3df;
        --paper-edge: #ecdcb8;
        --rule: #d0675a;
        --ink: #2b2118;
        --ink-muted: #76664f;
        --ui: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181a;
          --fg: #ececea;
          --muted: #9b9a96;
          --line: #2c2f33;
          --card: #1e2124;
          --accent: #7fc7a0;
          --warn: #e0a074;
          --bar: #363a3f;
          --leather: #6a2317;
          --leather-ink: #e9a58f;
          --stitch: #d9ab80;
          --paper: #26221c;
          --paper-edge: #3a3328;
          --rule: #a5463a;
          --ink: #eee5d3;
          --ink-muted: #a89a82;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.8 system-ui, -apple-system, "Hiragino Mincho ProN", "Noto Serif JP", serif;
      }
      button {
        font: inherit;
        font-family: var(--ui);
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      a {
        color: var(--accent);
      }
    </style>
  <script type="module" crossorigin src="./chunk-b1s7ae5r.js"></script></head>
  <body>
    <div id="app"></div>
    
  </body>
</html>
