<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>止まった柱時計</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7;
    --fg: #1c1b19;
    --muted: #6b6862;
    --line: #e2ded5;
    --card: #ffffff;
    --accent: #2f6f4f;
    --warn: #a4562a;
    --bar: #d9d4c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #ececea;
      --muted: #9b9a96;
      --line: #2c2f33;
      --card: #1e2124;
      --accent: #7fc7a0;
      --warn: #e0a074;
      --bar: #363a3f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.8 system-ui, -apple-system, "Hiragino Mincho ProN", "Noto Serif JP", serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 56px; }
  .titlebar { display: flex; gap: 16px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: 0.02em; }
  .byline { color: var(--muted); font-size: 13px; margin: 2px 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.08em; }
  button {
    font: inherit; font-family: system-ui, sans-serif;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }

  .columns { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 720px) { .columns { grid-template-columns: 1fr; } }

  /* The place and the people in it: the one thing the game shows for free. */
  .place { font-size: 17px; margin: 0 0 8px; }
  .place-desc { color: var(--muted); font-size: 13.5px; margin: 0 0 4px; }
  .people { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .person { display: flex; gap: 10px; align-items: center; }
  .avatar {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--bg);
    display: grid; place-items: center; font-size: 19px;
  }
  .person .name { font-size: 14px; line-height: 1.3; }
  .person .role { font-size: 12px; color: var(--muted); }

  .items { display: flex; flex-direction: column; gap: 8px; }
  .item { border-left: 2px solid var(--accent); padding-left: 10px; }
  .item .name { font-size: 13.5px; }
  .item .desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .empty { color: var(--muted); font-size: 13px; }

  /* The log is the game. Everything the player has read stays in it. */
  #log { min-height: 260px; }
  .entry { margin: 0 0 16px; }
  .entry:last-child { margin-bottom: 0; }
  .entry p { margin: 0 0 4px; }
  .entry.said { border-top: 1px solid var(--line); padding-top: 14px; }
  .typed { font-family: system-ui, sans-serif; font-size: 13px; color: var(--accent); margin: 0 0 6px; }
  .did { font-size: 12.5px; color: var(--muted); font-family: system-ui, sans-serif; margin: 0 0 6px; }
  .entry.miss p { color: var(--muted); font-style: italic; }
  .speaker { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; }
  .speaker .avatar { width: 26px; height: 26px; font-size: 14px; }
  .speaker .name { font-size: 12.5px; color: var(--muted); font-family: system-ui, sans-serif; }
  .found {
    display: inline-block; font-family: system-ui, sans-serif; font-size: 12px;
    border: 1px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 1px 10px; margin-top: 4px;
  }
  .place-change { font-family: system-ui, sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }

  form { display: flex; gap: 10px; margin-top: 4px; }
  input[type=text], textarea {
    font: inherit; flex: 1 1 auto; min-width: 0;
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  textarea { width: 100%; min-height: 130px; resize: vertical; line-height: 1.8; }
  .hint { font-size: 12px; color: var(--muted); font-family: system-ui, sans-serif; margin: 8px 0 0; }
  .banner {
    border: 1px solid var(--accent); background: transparent;
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  }
  .banner p { margin: 0 0 10px; font-size: 14px; }
  .error { color: var(--warn); font-size: 13px; font-family: system-ui, sans-serif; margin: 8px 0 0; }
  .thinking { color: var(--muted); font-size: 13px; font-family: system-ui, sans-serif; }

  /* The scorecard is only ever drawn after the ending. */
  .ending h3 { font-size: 19px; margin: 0 0 10px; }
  .score { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-family: system-ui, sans-serif; font-size: 13px; margin-top: 14px; }
  .score .mark { color: var(--accent); }
  .score .mark.no { color: var(--muted); }
  .coherence { margin-top: 12px; font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); }
  .track { background: var(--bar); border-radius: 3px; height: 6px; margin: 6px 0; }
  .track > div { background: var(--accent); height: 6px; border-radius: 3px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; font-family: system-ui, sans-serif; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="titlebar">
    <div>
      <h1 id="title">事件を読み込んでいます</h1>
      <p class="byline" id="byline"></p>
    </div>
    <button id="restart" class="secondary" hidden>最初から</button>
  </div>

  <div id="banner" class="banner" hidden>
    <p id="banner-text"></p>
    <button id="gather">全員を集める</button>
  </div>

  <div class="columns">
    <div>
      <div class="card">
        <h2>いま いる ところ</h2>
        <p class="place" id="place">—</p>
        <div id="place-desc"></div>
        <div class="people" id="people"></div>
      </div>
      <div class="card">
        <h2>手 の 中 の もの</h2>
        <div class="items" id="items"><p class="empty">まだ何も持っていない。</p></div>
      </div>
    </div>

    <div>
      <div class="card" id="log"></div>
      <div class="card" id="control">
        <form id="act-form">
          <input type="text" id="input" autocomplete="off" placeholder="何をしますか">
          <button id="send" type="submit">する</button>
        </form>
        <p class="hint">思いついたことを書いてください。できることの一覧はありません。</p>
        <p class="error" id="error" hidden></p>
      </div>
    </div>
  </div>

  <footer>
    <span id="api-note"></span>
    ソースは <a href="https://github.com/ocknamo/sandbox/tree/main/jev-mystery">jev-mystery</a>。
    入力の解釈と推理の採点に <a href="https://docs.typesafe.ai/introduction">Jev</a> を使っています。
  </footer>
</main>

<script>
// The service holds the case. This page holds nothing but what it has been
// told, which is the point: the list of things you could type is on the other
// side of the wire, and no amount of reading this file will produce it.
const DEPLOYED_API = 'https://jev-mystery-api-329294726644.asia-northeast1.run.app';
const API = (new URLSearchParams(location.search).get('api') || DEPLOYED_API).replace(/\/+$/, '');

const el = (id) => document.getElementById(id);
const logEl = el('log'), inputEl = el('input'), sendEl = el('send'), errorEl = el('error');
const bannerEl = el('banner'), bannerTextEl = el('banner-text'), gatherEl = el('gather');
const controlEl = el('control'), restartEl = el('restart');

// The turn form is taken out of the page when the finale replaces it and put
// back when a new case starts, so its listener is bound once and survives.
const actFormEl = el('act-form'), hintEl = document.querySelector('#control .hint');

let token = null;
let busy = false;

if (API !== DEPLOYED_API) el('api-note').textContent = `API: ${API} ・ `;

function say(text, cls) {
  const entry = document.createElement('div');
  entry.className = 'entry' + (cls ? ' ' + cls : '');
  for (const line of text || []) {
    const p = document.createElement('p');
    p.textContent = line;
    entry.appendChild(p);
  }
  logEl.appendChild(entry);
  return entry;
}

function prepend(entry, node) { entry.insertBefore(node, entry.firstChild); }

function line(cls, text) {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = text;
  return p;
}

function avatar(person) {
  const node = document.createElement('div');
  node.className = 'avatar';
  node.textContent = person.avatar || '？';
  return node;
}

function drawView(view) {
  el('place').textContent = view.scene.name;

  const desc = el('place-desc');
  desc.replaceChildren();
  for (const p of view.scene.description || []) desc.appendChild(line('place-desc', p));

  const people = el('people');
  people.replaceChildren();
  for (const person of view.people || []) {
    const row = document.createElement('div');
    row.className = 'person';
    row.appendChild(avatar(person));
    const names = document.createElement('div');
    names.appendChild(line('name', person.name));
    names.appendChild(line('role', person.role));
    row.appendChild(names);
    people.appendChild(row);
  }
  if (!(view.people || []).length) {
    people.appendChild(line('empty', 'ここには誰もいない。'));
  }

  const items = el('items');
  items.replaceChildren();
  for (const item of view.evidence || []) {
    const node = document.createElement('div');
    node.className = 'item';
    node.appendChild(line('name', item.name));
    node.appendChild(line('desc', item.description));
    items.appendChild(node);
  }
  if (!(view.evidence || []).length) {
    items.appendChild(line('empty', 'まだ何も持っていない。'));
  }

  // The only hint the game volunteers, and it is about the case's progress
  // rather than about what to type.
  bannerEl.hidden = !view.finale_open || view.finished;
  if (view.finale_open) {
    bannerTextEl.textContent = '手の中のもので、そろそろ話がつながりそうだ。';
    gatherEl.textContent = view.finale_label || '全員を集める';
  }
}

async function call(path, body) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `${res.status}`);
  return data;
}

function setBusy(on, what) {
  busy = on;
  sendEl.disabled = on;
  inputEl.disabled = on;
  gatherEl.disabled = on;
  errorEl.hidden = true;
  if (on) {
    const wait = say([what || '……'], 'miss');
    wait.classList.add('thinking');
    wait.id = 'thinking';
  } else {
    el('thinking')?.remove();
  }
}

function fail(err) {
  errorEl.textContent = String(err.message || err);
  errorEl.hidden = false;
}

async function start() {
  restartEl.hidden = true;
  controlEl.replaceChildren(actFormEl, hintEl, errorEl);
  controlEl.hidden = false;
  errorEl.hidden = true;
  sendEl.disabled = inputEl.disabled = false;
  logEl.replaceChildren();
  try {
    const data = await call('/api/new', {});
    token = data.state;
    document.title = data.title;
    el('title').textContent = data.title;
    el('byline').textContent = data.byline || '';
    say(data.opening);
    say(data.incident);
    drawView(data.view);
    restartEl.hidden = false;
    inputEl.focus();
  } catch (err) {
    fail(err);
  }
}

async function act(input) {
  setBusy(true, '……');
  try {
    const data = await call('/api/act', { state: token, input });
    token = data.state;
    setBusy(false);

    const entry = say(data.text, data.matched ? 'said' : 'said miss');
    if (data.did) prepend(entry, line('did', data.did));
    if (data.speaker) {
      const row = document.createElement('div');
      row.className = 'speaker';
      row.appendChild(avatar(data.speaker));
      row.appendChild(line('name', data.speaker.name));
      prepend(entry, row);
    }
    prepend(entry, line('typed', '> ' + input));
    for (const item of data.gained || []) {
      entry.appendChild(line('found', '見つけた: ' + item.name));
    }
    if (data.moved_to) {
      entry.appendChild(line('place-change', '— ' + data.view.scene.name + ' —'));
    }
    drawView(data.view);
    if (data.finale) askForSolution();
    entry.scrollIntoView({ behavior: 'smooth', block: 'end' });
  } catch (err) {
    setBusy(false);
    fail(err);
  }
}

// The finale is not a screen the player opens. They reach it by asking to
// gather everyone, in whatever words, and the service decides whether they may.
function askForSolution() {
  bannerEl.hidden = true;
  controlEl.replaceChildren();

  const area = document.createElement('textarea');
  area.placeholder = '誰が、どうやって、なぜ。';
  const submit = document.createElement('button');
  submit.textContent = '推理を述べる';

  const form = document.createElement('form');
  form.style.display = 'block';
  form.appendChild(area);
  const row = document.createElement('div');
  row.style.marginTop = '10px';
  row.appendChild(submit);
  form.appendChild(row);
  form.appendChild(line('hint', '文章で書いてください。名指しだけでも、筋道まで書いても構いません。'));
  form.appendChild(errorEl);
  controlEl.appendChild(form);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const answer = area.value.trim();
    if (!answer || busy) return;
    submit.disabled = area.disabled = true;
    const mine = say([], 'said');
    mine.appendChild(line('typed', answer));
    setBusy(true, '……三人は黙ってあなたを見ている。');
    try {
      const data = await call('/api/accuse', { state: token, answer });
      token = data.state;
      setBusy(false);
      // Nothing more can be typed, so the form goes rather than sitting
      // there empty under the ending.
      controlEl.replaceChildren();
      controlEl.hidden = true;
      showEnding(data);
    } catch (err) {
      setBusy(false);
      submit.disabled = area.disabled = false;
      fail(err);
    }
  });
  area.focus();
}

function showEnding(data) {
  const entry = say(data.text, 'said ending');
  const h = document.createElement('h3');
  h.textContent = data.title;
  prepend(entry, h);

  // Safe here and nowhere earlier: the case is over by the time it is read.
  const score = document.createElement('div');
  score.className = 'score';
  const add = (mark, label, hit) => {
    const m = document.createElement('span');
    m.className = 'mark' + (hit ? '' : ' no');
    m.textContent = mark;
    const l = document.createElement('span');
    l.textContent = label;
    score.append(m, l);
  };
  add(data.correct ? '○' : '×', data.correct
    ? `犯人を言い当てた（${data.named_name}）`
    : data.named_name ? `${data.named_name}を指した` : '犯人を名指ししなかった', data.correct);
  for (const p of data.points || []) add(p.hit ? '○' : '×', p.label, p.hit);
  entry.appendChild(score);

  const coherence = document.createElement('div');
  coherence.className = 'coherence';
  const track = document.createElement('div');
  track.className = 'track';
  const fill = document.createElement('div');
  fill.style.width = `${Math.round(100 * (data.coherence / (data.coherence_top || 1)))}%`;
  track.appendChild(fill);
  coherence.append(`筋の通り ${data.coherence.toFixed(1)} / ${data.coherence_top}`, track);
  if (data.coherence_legend) coherence.append(data.coherence_legend);
  entry.appendChild(coherence);

  entry.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

el('act-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = inputEl.value.trim();
  if (!input || busy) return;
  inputEl.value = '';
  act(input);
});

gatherEl.addEventListener('click', () => {
  if (busy) return;
  // Pressing the button is the same as typing it: it goes through the same
  // judgement, so the button is a convenience and not a second code path.
  act(gatherEl.textContent);
});

restartEl.addEventListener('click', () => {
  if (busy) return;
  start();
});

start();
</script>
</body>
</html>
