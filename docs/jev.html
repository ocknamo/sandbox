<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostr おすすめタイムライン</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7;
    --fg: #1c1b19;
    --muted: #6b6862;
    --line: #e2ded5;
    --card: #ffffff;
    --accent: #2f6f4f;
    --warn: #a4562a;
    --bar: #d9d4c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #ececea;
      --muted: #9b9a96;
      --line: #2c2f33;
      --card: #1e2124;
      --accent: #7fc7a0;
      --warn: #e0a074;
      --bar: #363a3f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.7 system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 64px; }
  .titlebar { display: flex; gap: 16px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button.link {
    background: none; border: none; color: var(--muted);
    padding: 2px 6px; font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  select {
    font: inherit;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
  }
  .sliders { display: grid; gap: 14px; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .slider label { font-size: 14px; }
  .slider .val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.4em; text-align: right; }
  .slider input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .slider .hint { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin: -4px 0 0; }
  .slider.off input[type=range] { opacity: 0.4; }
  .langrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; margin: 2px 0 6px; }
  .chip {
    font: inherit; font-size: 12.5px; line-height: 1.4;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chipbar { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; grid-column: 1 / -1; }
  .postbody { display: flex; gap: 14px; align-items: flex-start; }
  .postbody .left { flex: 1 1 auto; min-width: 0; }
  .radar { flex: 0 0 auto; }
  .radar .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .radar .spoke { stroke: var(--line); stroke-width: 1; }
  .radar .shape { fill: var(--accent); fill-opacity: 0.22; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .radar .peak { fill: var(--accent); }
  #axis-order:empty { display: none; }
  .radar .axislabel { fill: var(--muted); font-size: 9px; }
  @media (max-width: 560px) {
    /* The radar sits beside the signals on a wide card; on a phone there is
       no room beside anything, so it goes underneath. */
    .postbody { flex-direction: column; align-items: center; }
    .postbody .left { width: 100%; }
  }
  .radar figcaption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .post { border-top: 1px solid var(--line); padding: 14px 0; }
  .post:first-child { border-top: none; }
  .post .content { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .post.out .content { color: var(--muted); }
  .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .tag.why { border-color: var(--accent); color: var(--accent); }
  .tag.veto { border-color: var(--warn); color: var(--warn); }
  .signals { display: grid; grid-template-columns: 6.5em 1fr 3em; gap: 2px 8px; margin-top: 8px; font-size: 12.5px; }
  .signals .name { color: var(--muted); }
  .signals .track { background: var(--bar); border-radius: 3px; align-self: center; height: 6px; }
  /* display:block, or the width set on this inline span does nothing. */
  .signals .fill { display: block; background: var(--accent); border-radius: 3px; height: 6px; }
  .signals .fill.neg { background: var(--warn); }
  .signals .num { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--warn); }
  code { font-size: 12.5px; background: var(--bar); padding: 1px 5px; border-radius: 4px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 32px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="titlebar">
    <h1 data-i18n="title"></h1>
    <button id="ui-lang" class="link" type="button"></button>
  </div>
  <p class="lede" data-i18n-html="lede"></p>

  <div class="card">
    <div class="row">
      <button id="start" data-i18n="start"></button>
      <button id="stop" class="secondary" disabled data-i18n="stop"></button>
      <select id="relay">
        <option value="wss://yabu.me" data-i18n="relayYabu"></option>
        <option value="wss://relay.damus.io">relay.damus.io</option>
        <option value="wss://nos.lol">nos.lol</option>
        <option value="wss://relay.nostr.band">relay.nostr.band</option>
      </select>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="filters"></h2>
    <div class="sliders">
      <div class="slider">
        <label for="appeal" data-i18n="appealLabel"></label>
        <span class="val" id="appeal-val">0.50</span>
        <input type="range" id="appeal" min="0" max="1" step="0.01" value="0.5">
        <p class="hint" data-i18n-html="appealHint"></p>
      </div>
      <div class="slider">
        <label for="promo" data-i18n="promoLabel"></label>
        <span class="val" id="promo-val">0.50</span>
        <input type="range" id="promo" min="0" max="1" step="0.01" value="0.5">
        <p class="hint" data-i18n-html="promoHint"></p>
      </div>
      <div class="slider">
        <label for="substance" data-i18n="substanceLabel"></label>
        <span class="val" id="substance-val">0.00</span>
        <input type="range" id="substance" min="0" max="4" step="0.1" value="0">
        <p class="hint" data-i18n-html="substanceHint"></p>
      </div>
      <div class="slider off" id="topic-slider">
        <div class="chipbar">
          <label for="interest" data-i18n="topicLabel"></label>
          <button type="button" class="chip" id="topic-clear" data-i18n="topicClear"></button>
        </div>
        <div class="chips" id="topics"></div>
        <p class="hint" id="axis-order"></p>
        <span class="val" id="interest-val">0.40</span>
        <input type="range" id="interest" min="0" max="1" step="0.01" value="0.4">
        <p class="hint" data-i18n-html="topicHint"></p>
      </div>
      <div class="slider off" id="lang-slider">
        <div class="langrow">
          <label for="lang" data-i18n="langLabel"></label>
          <select id="lang"></select>
        </div>
        <span class="val" id="langness-val">0.50</span>
        <input type="range" id="langness" min="0" max="1" step="0.01" value="0.5">
        <p class="hint" data-i18n-html="langHint"></p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span data-i18n="kept"></span> <span id="kept-count" class="status"></span></h2>
    <div id="kept"></div>
  </div>

  <div class="card">
    <h2><span data-i18n="dropped"></span> <span id="dropped-count" class="status"></span></h2>
    <div id="dropped"></div>
  </div>

  <footer>
    <span data-i18n-html="footer"></span>
    <div id="api-host"></div>
  </footer>
</main>

<script>
// This page is a static file on GitHub Pages, so it always calls the scoring
// service across origins. That works because the service answers every origin
// with Access-Control-Allow-Origin: *.
// ?api=http://localhost:8080 points it at a local `go run ./cmd/server`.
const DEPLOYED_API = 'https://jev-nostr-api-329294726644.asia-northeast1.run.app';
const API = (new URLSearchParams(location.search).get('api') || DEPLOYED_API).replace(/\/+$/, '');

// How many posts to gather before sending a batch, and how long to wait before
// sending a short one. The service caps a batch at 30.
const BATCH_SIZE = 8;
const BATCH_WAIT_MS = 4000;

// How many stored posts to ask the relay for on connecting.
const RELAY_LIMIT = 500;

// How many scored posts to keep. A relay replay can hand over far more than a
// page can usefully show, and each one holds its own distributions.
const KEEP_SCORED = 300;

// The language options are fetched from /api/questions so that the list here
// cannot drift from the one the model is actually given. This is the fallback
// for when that call fails.
const FALLBACK_LANGUAGES = ['ja', 'en', 'zh', 'ko', 'ru', 'de', 'fr', 'es', 'pt', 'none', 'other'];

// Strings marked -html carry inline markup and are written here, never built
// from anything a relay sent.
const STRINGS = {
  ja: {
    htmlLang: 'ja',
    switchTo: 'English',
    title: 'Nostr おすすめタイムライン',
    docTitle: 'Nostr おすすめタイムライン',
    lede: 'リレーから流れてくる投稿を <a href="https://docs.typesafe.ai/" rel="noopener">Jev</a> に判定させ、'
        + 'おすすめだけ残します。しきい値はブラウザ側で適用しているので、'
        + '<strong>スライダーを動かしても再判定は走りません</strong>（＝待ち時間ゼロ・追加コストゼロ）。',
    start: '接続して集める',
    stop: '停止',
    relayYabu: 'yabu.me（日本語が多い）',
    filters: 'しきい値',
    appealLabel: 'appeal（insight / humor / relatable の最大値）がこの値以上',
    appealHint: '3 つのうち<strong>どれか 1 つ</strong>が越えれば通ります。平均ではありません。ダジャレは洞察がなくても通るべきなので。',
    promoLabel: 'promotional がこの値以上なら拒否',
    promoHint: '減点ではなく拒否です。よく書けた広告も広告なので。',
    substanceLabel: 'substance がこの値以上（0 で無効）',
    substanceHint: '<code>score</code> は 0〜4 の期待値で、実測では一番よく分離しました'
        + '（中身のある投稿 3.5+、<code>gm</code> は 0.00）。1.5 あたりに上げると雑談が落ちます。',
    topicLabel: '興味のあるトピック（選んだものがレーダーの軸になります）',
    topicClear: 'すべて解除',
    topicHint: '選んだトピックの確率を<strong>足した値</strong>がこの値以上なら残します。'
        + '<code>choice</code> の確率は合計 1 なので、2 つのトピックに跨る投稿は '
        + 'tech 0.45 / sports 0.40 のように薄まります。両方選んでいれば 0.85 として扱われ、'
        + 'それが「私の興味のどれかに当たる確率」そのものです。',
    topicNames: {
      tech: 'テクノロジー', bitcoin: 'ビットコイン', nostr: 'Nostr', science: '自然科学',
      health: '健康・医療', politics: '政治・社会', business: '経済・ビジネス',
      religion: '宗教', philosophy: '哲学・思想', sports: 'スポーツ', games: 'ゲーム',
      anime: 'アニメ・マンガ', music: '音楽', film: '映画・ドラマ', books: '本・文学',
      art: 'アート・デザイン', photo: '写真', food: '料理・グルメ', travel: '旅行・地域',
      nature: '自然・生き物', life: '暮らし・仕事', other: 'その他',
    },
    belowTopic: '興味の外',
    interestIs: (v) => `興味 ${v}`,
    radarCaption: (v) => `興味 ${v}`,
    axisOrder: (list) => `レーダーの軸は 12 時から時計回りに ${list}。ホバーで数値が出ます。`,
    langLabel: '言語',
    langHint: 'その言語らしさがこの値以上の投稿だけ残します。判定は 1 つの <code>choice</code> 質問で、'
        + '返ってくる確率分布がそのまま「らしさ」です。'
        + '混在した投稿は複数の言語に重みが散るので、しきい値を下げると拾えます。',
    langAll: 'すべて',
    langNone: '言語なし（絵文字・記号のみ）',
    langOther: 'その他の言語',
    kept: 'おすすめ',
    dropped: '除外',
    empty: 'まだありません。',
    count: (n) => `${n} 件`,
    idle: '未接続',
    connecting: (host) => `${host} に接続中…`,
    connected: (host) => `${host} に接続、投稿を待っています`,
    scoring: (n) => `判定中… (${n} 件のリクエスト)`,
    scored: (n) => `${n} 件を判定済み`,
    partial: (ok, bad, err) => `${ok} 件を判定、${bad} 件は失敗（${err}）`,
    scoreFailed: (err) => `判定に失敗: ${err}`,
    relayFailed: 'リレーに接続できませんでした',
    disconnected: '切断されました',
    stopped: '停止しました',
    vetoed: '宣伝として拒否',
    keptBecause: (why) => `${why} で採用`,
    belowSubstance: 'substance 不足',
    belowLang: (lang) => `${lang} らしさ不足`,
    belowAppeal: (why, v) => `最高でも ${why} ${v}`,
    apiHost: 'スコアリング API: ',
    footer: '投稿は選んだリレーからブラウザが直接受け取ります。判定だけが API を経由します'
        + '（<a href="https://api.typesafe.ai" rel="noopener">api.typesafe.ai</a> はブラウザからの'
        + 'オリジンを拒否するうえ、静的ページに API キーは置けないため）。'
        + 'このサービスは実験中のデモで、予告なく停止することがあります。',
  },
  en: {
    htmlLang: 'en',
    switchTo: '日本語',
    title: 'Nostr recommended timeline',
    docTitle: 'Nostr recommended timeline',
    lede: 'Posts arriving from a relay are judged by <a href="https://docs.typesafe.ai/" rel="noopener">Jev</a>, '
        + 'and only the recommended ones are kept. The thresholds are applied in your browser, so '
        + '<strong>moving a slider re-scores nothing</strong> — no wait, no extra cost.',
    start: 'Connect and collect',
    stop: 'Stop',
    relayYabu: 'yabu.me (mostly Japanese)',
    filters: 'Thresholds',
    appealLabel: 'appeal (the highest of insight / humor / relatable) at or above',
    appealHint: '<strong>Any one</strong> of the three clearing this is enough. Not the average: a pun has earned its place without insight.',
    promoLabel: 'reject when promotional is at or above',
    promoHint: 'A veto, not a penalty. A well-written advertisement is still an advertisement.',
    substanceLabel: 'substance at or above (0 disables it)',
    substanceHint: '<code>score</code> is an expected level from 0 to 4, and it separates posts better than anything else measured so far '
        + '(3.5+ for posts with something in them, 0.00 for <code>gm</code>). Around 1.5 the chatter drops out.',
    topicLabel: 'Topics you are interested in (the ones you pick become the radar axes)',
    topicClear: 'Clear all',
    topicHint: 'Keeps a post when the probabilities of the topics you picked, <strong>added together</strong>, '
        + 'reach this value. A <code>choice</code> sums to 1, so a post spanning two subjects thins out to '
        + 'tech 0.45 / sports 0.40. Pick both and it counts as 0.85, which is exactly '
        + '"the chance this post is about something I care about".',
    topicNames: {
      tech: 'Technology', bitcoin: 'Bitcoin', nostr: 'Nostr', science: 'Science',
      health: 'Health', politics: 'Politics', business: 'Business',
      religion: 'Religion', philosophy: 'Philosophy', sports: 'Sports', games: 'Games',
      anime: 'Anime', music: 'Music', film: 'Film & TV', books: 'Books',
      art: 'Art & design', photo: 'Photography', food: 'Food', travel: 'Travel',
      nature: 'Nature', life: 'Everyday life', other: 'Other',
    },
    belowTopic: 'outside your topics',
    interestIs: (v) => `interest ${v}`,
    radarCaption: (v) => `interest ${v}`,
    axisOrder: (list) => `Radar axes, clockwise from twelve: ${list}. Hover for the values.`,
    langLabel: 'Language',
    langHint: 'Keeps only posts that read at least this much like the chosen language. One <code>choice</code> question answers it, '
        + 'and the probability distribution it returns is the "reads like" score. '
        + 'A mixed post spreads its weight over several languages, so lower the threshold to catch those.',
    langAll: 'Any',
    langNone: 'No language (emoji or symbols only)',
    langOther: 'Another language',
    kept: 'Recommended',
    dropped: 'Filtered out',
    empty: 'Nothing yet.',
    count: (n) => `${n}`,
    idle: 'Not connected',
    connecting: (host) => `Connecting to ${host}…`,
    connected: (host) => `Connected to ${host}, waiting for posts`,
    scoring: (n) => `Scoring… (${n} request${n === 1 ? '' : 's'})`,
    scored: (n) => `${n} post${n === 1 ? '' : 's'} scored`,
    partial: (ok, bad, err) => `${ok} scored, ${bad} failed (${err})`,
    scoreFailed: (err) => `Scoring failed: ${err}`,
    relayFailed: 'Could not connect to the relay',
    disconnected: 'Disconnected',
    stopped: 'Stopped',
    vetoed: 'vetoed as promotional',
    keptBecause: (why) => `kept on ${why}`,
    belowSubstance: 'below substance',
    belowLang: (lang) => `not ${lang} enough`,
    belowAppeal: (why, v) => `best was ${why} ${v}`,
    apiHost: 'Scoring API: ',
    footer: 'Posts come straight from the relay you pick; only the judging goes through the API '
        + '(<a href="https://api.typesafe.ai" rel="noopener">api.typesafe.ai</a> refuses a browser origin, '
        + 'and a static page has nowhere to keep an API key). '
        + 'This is an experimental demo and may be taken down without notice.',
  },
};

const el = (id) => document.getElementById(id);
const startEl = el('start'), stopEl = el('stop'), relayEl = el('relay'), statusEl = el('status');
const keptEl = el('kept'), droppedEl = el('dropped');
const keptCountEl = el('kept-count'), droppedCountEl = el('dropped-count');
const langEl = el('lang'), langSliderEl = el('lang-slider');
const topicsEl = el('topics'), topicSliderEl = el('topic-slider');

// Name the host being called, so a page pointed at the wrong deployment shows
// it instead of just failing to score anything.
const apiLink = document.createElement('a');
apiLink.href = API + '/health';
apiLink.textContent = new URL(API).host;
apiLink.rel = 'noopener';

// scored holds every post that has come back, newest first. Verdicts are never
// stored: they are recomputed from the controls on every render, which is what
// makes moving a slider free.
let scored = [];
let pending = [];       // posts collected from the relay, not yet sent
let seen = new Set();   // event ids, so a reconnect does not pay twice
let socket = null;
let batchTimer = null;
let inFlight = 0;
let languageKeys = FALLBACK_LANGUAGES;
let topicKeys = [];                 // filled from /api/questions
let selectedTopics = new Set();     // the reader's interests, and the radar axes

let uiLang = 'ja';
try {
  const saved = localStorage.getItem('jev-ui-lang');
  if (saved && STRINGS[saved]) uiLang = saved;
  else if (!navigator.language.startsWith('ja')) uiLang = 'en';
} catch { /* private mode: the default stands */ }

try {
  const saved = JSON.parse(localStorage.getItem('jev-topics') || '[]');
  if (Array.isArray(saved)) selectedTopics = new Set(saved.filter((c) => typeof c === 'string'));
} catch { /* nothing remembered, which is the same as nothing selected */ }

const t = () => STRINGS[uiLang];

// languageName leans on Intl for the names of real languages, so the list does
// not need a translation of every language into every UI language. The two
// options that are not languages get their own wording.
function languageName(code) {
  if (code === 'none') return t().langNone;
  if (code === 'other') return t().langOther;
  try {
    return new Intl.DisplayNames([uiLang], { type: 'language' }).of(code) || code;
  } catch {
    return code;
  }
}

// topicName falls back to the raw key, so a topic added to the model shows up
// as itself rather than disappearing from a page that has no word for it yet.
function topicName(code) {
  return t().topicNames[code] || code;
}

// lastStatus remembers how to say the current status again after a language
// switch, rather than leaving a stale sentence behind.
let lastStatus = { key: 'idle', args: [], isError: false };

function setStatus(key, args = [], isError = false) {
  lastStatus = { key, args, isError };
  const value = t()[key];
  statusEl.textContent = typeof value === 'function' ? value(...args) : value;
  statusEl.classList.toggle('err', isError);
}

function applyLanguage() {
  document.documentElement.lang = t().htmlLang;
  document.title = t().docTitle;
  el('ui-lang').textContent = t().switchTo;

  for (const node of document.querySelectorAll('[data-i18n]')) {
    node.textContent = t()[node.dataset.i18n];
  }
  for (const node of document.querySelectorAll('[data-i18n-html]')) {
    // These strings are constants defined above, never relay content.
    node.innerHTML = t()[node.dataset.i18nHtml];
  }

  el('api-host').replaceChildren(t().apiHost, apiLink);

  buildLanguageOptions();
  buildTopicChips();
  setStatus(lastStatus.key, lastStatus.args, lastStatus.isError);
  render();
}

function buildTopicChips() {
  topicsEl.replaceChildren();
  // Ordered by the name being shown, so the row reads alphabetically in
  // whichever language the page is in. "other" sits at the end, where a list
  // of subjects expects its exception.
  const ordered = [...topicKeys].sort((a, b) =>
    ((a === 'other') - (b === 'other')) || topicName(a).localeCompare(topicName(b), uiLang));

  for (const code of ordered) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.dataset.topic = code;
    chip.textContent = topicName(code);
    chip.setAttribute('aria-pressed', String(selectedTopics.has(code)));
    chip.addEventListener('click', () => {
      if (selectedTopics.has(code)) selectedTopics.delete(code);
      else selectedTopics.add(code);
      chip.setAttribute('aria-pressed', String(selectedTopics.has(code)));
      saveTopics();
      render();
    });
    topicsEl.append(chip);
  }
}

function saveTopics() {
  try { localStorage.setItem('jev-topics', JSON.stringify([...selectedTopics])); }
  catch { /* private mode: the selection just does not outlive the page */ }
}

function buildLanguageOptions() {
  const current = langEl.value;
  langEl.replaceChildren();

  const any = document.createElement('option');
  any.value = '';
  any.textContent = t().langAll;
  langEl.append(any);

  // The two languages this page itself speaks come first, the reader's own
  // ahead of the other, because those are the ones actually reached for. The
  // rest follow by the name being shown rather than by the two-letter code,
  // which would read as an arbitrary shuffle. The two options that are not
  // languages sit at the end, where a list of languages expects its
  // exceptions.
  const rank = (code) => {
    if (code === 'other') return 4;
    if (code === 'none') return 3;
    if (code === uiLang) return 0;
    if (STRINGS[code]) return 1;
    return 2;
  };
  const ordered = [...languageKeys].sort((a, b) =>
    (rank(a) - rank(b)) || languageName(a).localeCompare(languageName(b), uiLang));

  for (const code of ordered) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = languageName(code);
    langEl.append(opt);
  }
  langEl.value = languageKeys.includes(current) ? current : '';
}

function thresholds() {
  return {
    appeal: parseFloat(el('appeal').value),
    promotional: parseFloat(el('promo').value),
    substance: parseFloat(el('substance').value),
    language: langEl.value,
    langness: parseFloat(el('langness').value),
    topics: selectedTopics,
    interest: parseFloat(el('interest').value),
  };
}

// interestIn is the chance a post is about something the reader picked.
//
// A choice's probabilities sum to 1, so the scores of the chosen topics can be
// added: a post at tech 0.45 and sports 0.40 clears neither on its own, but a
// reader interested in both is right to call it 0.85. Asking any single score
// to clear a threshold would throw away every post that spans two subjects,
// which is most of the interesting ones.
function interestIn(r, topics) {
  let sum = 0;
  for (const code of topics) sum += (r.topic_scores || {})[code] ?? 0;
  return sum;
}

// verdict is the same rule as internal/recommend, applied in the browser: the
// strongest of the three positive signals, with promotion as a veto. Language
// is a filter on top, never part of what the model decided.
function verdict(r, c) {
  if (r.promotional >= c.promotional) return { keep: false, why: 'promotional', veto: true };
  if (c.language) {
    const score = (r.language_scores || {})[c.language] ?? 0;
    if (score < c.langness) return { keep: false, why: 'language', veto: false };
  }
  if (c.topics.size && interestIn(r, c.topics) < c.interest) {
    return { keep: false, why: 'topic', veto: false };
  }
  if (c.substance > 0 && (r.substance ?? 0) < c.substance) {
    return { keep: false, why: 'substance', veto: false };
  }
  if (r.appeal >= c.appeal) return { keep: true, why: r.reason, veto: false };
  return { keep: false, why: r.reason, veto: false };
}

function signalBar(name, value, max, negative) {
  const frac = Math.max(0, Math.min(1, max ? value / max : 0));
  return `
    <span class="name">${name}</span>
    <span class="track"><span class="fill${negative ? ' neg' : ''}" style="width:${(frac * 100).toFixed(1)}%"></span></span>
    <span class="num">${value.toFixed(2)}</span>`;
}

// topLanguages renders the distribution rather than only the winner, because a
// post can read half one language and half another, and that is exactly the
// case a threshold is being moved to catch.
function topLanguages(scores) {
  return Object.entries(scores || {})
    .filter(([, v]) => v >= 0.01)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 2)
    .map(([code, v]) => `${code} ${v.toFixed(2)}`)
    .join(' / ');
}

// radar draws one post's scores on the topics the reader picked.
//
// A radar reads shape rather than length, so it is weaker than a bar at
// telling two close values apart, and the area it encloses depends on the
// order of the axes. Two things keep it honest: the axis order is fixed by the
// selection, never per post, so cards are comparable; and the scale is a fixed
// 0 to 1 with rings, never normalised per post, so a faint post stays visibly
// faint. The summed interest is printed underneath, because that is the number
// the filter actually uses and no polygon conveys it.
// The box is wider than it is tall because the labels at three and nine
// o'clock need horizontal room that the ones at twelve and six do not. Sizing
// the box to the plot instead is what clipped them: a label has to fit inside
// the viewBox, and "テクノロジー" is wider than the chart.
// A starting box, widened to fit the labels once they have been measured; see
// fitRadars. Guessing the width from the plot is what clipped "料理・グルメ"
// into "理・グル…": a label anchored at the left vertex grows leftwards, and
// how far depends on the font, the language and the word.
const RADAR_W = 178, RADAR_H = 118, RADAR_R = 38;
const RADAR_RINGS = [0.25, 0.5, 0.75, 1];

// Labels are dropped past this many axes; below it they are truncated, since a
// radar this size has room for a word, not a phrase.
const RADAR_MAX_LABELS = 8;
const RADAR_LABEL_CHARS = 5;

function radar(r, axes) {
  const cx = RADAR_W / 2, cy = RADAR_H / 2;
  const radius = RADAR_R;
  const at = (i, frac) => {
    // Start at twelve o'clock and go clockwise, the way a reader expects.
    const angle = (i / axes.length) * 2 * Math.PI - Math.PI / 2;
    return [cx + Math.cos(angle) * radius * frac, cy + Math.sin(angle) * radius * frac];
  };

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${RADAR_W} ${RADAR_H}`);
  svg.setAttribute('width', RADAR_W);
  svg.setAttribute('height', RADAR_H);
  svg.setAttribute('role', 'img');

  const add = (name, attrs, cls) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [k, val] of Object.entries(attrs)) node.setAttribute(k, val);
    if (cls) node.setAttribute('class', cls);
    svg.append(node);
    return node;
  };
  const polygon = (points, cls) =>
    add('polygon', { points: points.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ') }, cls);

  // Rings and spokes first, so the data sits on top of them.
  for (const ring of RADAR_RINGS) polygon(axes.map((_, i) => at(i, ring)), 'ring');
  axes.forEach((_, i) => {
    const [x, y] = at(i, 1);
    add('line', { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1) }, 'spoke');
  });

  const values = axes.map((code) => Math.max(0, Math.min(1, (r.topic_scores || {})[code] ?? 0)));
  polygon(values.map((v, i) => at(i, v)), 'shape');

  // One dot, on the strongest axis: a marker on every vertex would crowd a
  // chart this size, and the peak is the only one worth pointing at.
  const peak = values.indexOf(Math.max(...values));
  if (values[peak] > 0) {
    const [x, y] = at(peak, values[peak]);
    add('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 2.5 }, 'peak');
  }

  // Naming the axes on the chart itself, because a reader scrolled down to a
  // card cannot see a legend that lives at the top of the page.
  if (axes.length <= RADAR_MAX_LABELS) {
    axes.forEach((code, i) => {
      const [x, y] = at(i, 1);
      // Push the label clear of the outer ring along its own spoke.
      const dx = x - cx, dy = y - cy;
      const len = Math.hypot(dx, dy) || 1;
      const lx = x + (dx / len) * 7;
      const ly = y + (dy / len) * 7;
      const label = add('text', { x: lx.toFixed(1), y: (ly + 3).toFixed(1) }, 'axislabel');
      label.setAttribute('text-anchor', lx < cx - 1 ? 'end' : lx > cx + 1 ? 'start' : 'middle');
      const name = topicName(code);
      label.textContent = name.length > RADAR_LABEL_CHARS ? name.slice(0, RADAR_LABEL_CHARS) + '…' : name;
      const full = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      full.textContent = name;
      label.append(full);
    });
  }

  // The values themselves, for a reader who cannot read the shape and for one
  // who wants the number.
  const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  title.textContent = axes.map((code, i) => `${topicName(code)} ${values[i].toFixed(2)}`).join(', ');
  svg.prepend(title);

  const figure = document.createElement('figure');
  figure.className = 'radar';
  figure.style.margin = '0';
  figure.append(svg);
  const caption = document.createElement('figcaption');
  caption.textContent = t().radarCaption(interestIn(r, axes).toFixed(2));
  figure.append(caption);
  return figure;
}

function postCard(r, v) {
  const node = document.createElement('div');
  node.className = 'post' + (v.keep ? '' : ' out');

  const content = document.createElement('p');
  content.className = 'content';
  content.textContent = r.content;
  node.append(content);

  const meta = document.createElement('div');
  meta.className = 'meta';

  const tag = document.createElement('span');
  if (v.veto) {
    tag.className = 'tag veto';
    tag.textContent = t().vetoed;
  } else if (v.keep) {
    tag.className = 'tag why';
    tag.textContent = t().keptBecause(v.why);
  } else {
    tag.className = 'tag';
    if (v.why === 'topic') tag.textContent = t().belowTopic;
    else if (v.why === 'substance') tag.textContent = t().belowSubstance;
    else if (v.why === 'language') tag.textContent = t().belowLang(languageName(thresholds().language));
    else tag.textContent = t().belowAppeal(v.why, r.appeal.toFixed(2));
  }
  meta.append(tag);

  if (r.kind) {
    const kind = document.createElement('span');
    kind.className = 'tag';
    kind.textContent = `${r.kind} ${r.kind_confidence.toFixed(2)}`;
    meta.append(kind);
  }
  if (r.topic) {
    const topic = document.createElement('span');
    topic.className = 'tag';
    topic.textContent = `${topicName(r.topic)} ${r.topic_confidence.toFixed(2)}`;
    meta.append(topic);
  }
  const langs = topLanguages(r.language_scores);
  if (langs) {
    const lang = document.createElement('span');
    lang.className = 'tag';
    lang.textContent = langs;
    meta.append(lang);
  }
  if (r.substance_legend) {
    const legend = document.createElement('span');
    legend.textContent = r.substance_legend;
    meta.append(legend);
  }

  const signals = document.createElement('div');
  signals.className = 'signals';
  signals.innerHTML =
    signalBar('insight', r.insight, 1, false) +
    signalBar('humor', r.humor, 1, false) +
    signalBar('relatable', r.relatable, 1, false) +
    signalBar('promotional', r.promotional, 1, true) +
    (r.substance == null ? '' : signalBar('substance', r.substance, r.substance_top || 4, false));

  // The radar needs at least three axes to be a shape at all. With one or two
  // selected topics the ordinary bars say it better anyway.
  const axes = [...selectedTopics];
  if (axes.length >= 3 && r.topic_scores) {
    const body = document.createElement('div');
    body.className = 'postbody';
    const left = document.createElement('div');
    left.className = 'left';
    left.append(meta, signals);
    body.append(left, radar(r, axes));
    node.append(body);
  } else {
    node.append(meta, signals);
    if (axes.length && r.topic_scores) {
      const bars = document.createElement('div');
      bars.className = 'signals';
      bars.innerHTML = axes
        .map((code) => signalBar(topicName(code), r.topic_scores[code] ?? 0, 1, false))
        .join('');
      node.append(bars);
    }
  }

  return node;
}

// fitRadars grows every radar's viewBox until the labels fit inside it.
//
// getBBox needs the element to be in the document, so this runs after the
// cards are appended rather than while they are built. The box is measured
// once and applied to all of them: a viewBox that differed per card would
// scale the plots differently, and comparing shapes across cards is the whole
// reason the axes are fixed in the first place.
function fitRadars() {
  const svgs = document.querySelectorAll('.radar svg');
  if (!svgs.length) return;

  const pad = 2;
  let minX = 0, minY = 0, maxX = RADAR_W, maxY = RADAR_H;
  for (const svg of svgs) {
    let box;
    try { box = svg.getBBox(); } catch { return; }   // not rendered yet
    if (!box.width && !box.height) return;
    minX = Math.min(minX, box.x - pad);
    minY = Math.min(minY, box.y - pad);
    maxX = Math.max(maxX, box.x + box.width + pad);
    maxY = Math.max(maxY, box.y + box.height + pad);
  }

  const w = maxX - minX, h = maxY - minY;
  for (const svg of svgs) {
    svg.setAttribute('viewBox', `${minX.toFixed(1)} ${minY.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
    svg.setAttribute('width', w.toFixed(1));
    svg.setAttribute('height', h.toFixed(1));
  }
}

function render() {
  const c = thresholds();
  langSliderEl.classList.toggle('off', !c.language);
  topicSliderEl.classList.toggle('off', !c.topics.size);

  // Said once rather than drawn on every card: at this size a named axis
  // either clips or leaves no room for the shape.
  const axes = [...c.topics];
  el('axis-order').textContent = axes.length >= 3
    ? t().axisOrder(axes.map(topicName).join(' → '))
    : '';

  const kept = [], dropped = [];
  for (const r of scored) {
    const v = verdict(r, c);
    (v.keep ? kept : dropped).push([r, v]);
  }
  // Strongest appeal first, substance breaking ties: the same order the API
  // would serve.
  kept.sort((a, b) => (b[0].appeal - a[0].appeal) || ((b[0].substance ?? 0) - (a[0].substance ?? 0)));

  for (const [target, list, counter] of [
    [keptEl, kept, keptCountEl],
    [droppedEl, dropped, droppedCountEl],
  ]) {
    target.replaceChildren();
    counter.textContent = list.length ? t().count(list.length) : '';
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'status';
      p.textContent = t().empty;
      target.append(p);
      continue;
    }
    for (const [r, v] of list) target.append(postCard(r, v));
  }

  fitRadars();
}

// The option lists are read from the service rather than written out here a
// second time, so neither can drift from what the model is actually given.
async function loadOptions() {
  try {
    const res = await fetch(`${API}/api/questions`);
    const data = await res.json();

    const languages = data.questions?.language?.criteria;
    if (languages && typeof languages === 'object') {
      languageKeys = Object.keys(languages);
      buildLanguageOptions();
    }
    const topics = data.questions?.topic?.criteria;
    if (topics && typeof topics === 'object') {
      topicKeys = Object.keys(topics);
      // Drop anything remembered that the model no longer offers.
      for (const code of [...selectedTopics]) {
        if (!topicKeys.includes(code)) selectedTopics.delete(code);
      }
      buildTopicChips();
      render();
    }
  } catch { /* the language fallback stands; the topic row stays empty */ }
}

async function sendBatch() {
  clearTimeout(batchTimer);
  batchTimer = null;
  if (!pending.length) return;

  const batch = pending.splice(0, 30);
  inFlight++;
  setStatus('scoring', [inFlight]);
  try {
    const res = await fetch(`${API}/api/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ posts: batch.map((p) => ({ id: p.id, content: p.content })) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

    const byId = new Map(batch.map((p) => [p.id, p]));
    const fresh = data.results
      .filter((r) => !r.error)
      .map((r) => ({ ...r, content: byId.get(r.id)?.content ?? '' }));
    const failed = data.results.filter((r) => r.error);

    scored = [...fresh, ...scored].slice(0, KEEP_SCORED);
    render();
    if (failed.length) setStatus('partial', [fresh.length, failed.length, failed[0].error], true);
    else setStatus('scored', [scored.length]);
  } catch (err) {
    setStatus('scoreFailed', [err.message || String(err)], true);
  } finally {
    inFlight--;
  }
}

function queue(event) {
  if (seen.has(event.id)) return;
  seen.add(event.id);
  if (!event.content || !event.content.trim()) return;

  pending.push({ id: event.id, content: event.content });
  if (pending.length >= BATCH_SIZE) {
    sendBatch();
  } else if (!batchTimer) {
    batchTimer = setTimeout(sendBatch, BATCH_WAIT_MS);
  }
}

function start() {
  stop();
  const url = relayEl.value;
  const host = new URL(url).host;
  setStatus('connecting', [host]);
  startEl.disabled = true;
  stopEl.disabled = false;

  socket = new WebSocket(url);
  socket.addEventListener('open', () => {
    setStatus('connected', [host]);
    // NIP-01: kinds:[1] is a plain text note. The limit is what a relay
    // replays from its store before it starts streaming live ones. It is high
    // because a narrow filter needs a lot of posts to find a few matches, and
    // every one of them is a paid request: a full replay is roughly 500 calls.
    socket.send(JSON.stringify(['REQ', 'timeline', { kinds: [1], limit: RELAY_LIMIT }]));
  });
  socket.addEventListener('message', (msg) => {
    let frame;
    try { frame = JSON.parse(msg.data); } catch { return; }
    // Relay frames are ["EVENT", <subscription>, <event>].
    if (Array.isArray(frame) && frame[0] === 'EVENT' && frame[2]) queue(frame[2]);
  });
  socket.addEventListener('error', () => setStatus('relayFailed', [], true));
  socket.addEventListener('close', () => {
    startEl.disabled = false;
    stopEl.disabled = true;
    if (socket) setStatus('disconnected');
  });
}

function stop() {
  clearTimeout(batchTimer);
  batchTimer = null;
  if (socket) {
    const s = socket;
    socket = null;          // so the close handler knows this was deliberate
    s.close();
  }
  startEl.disabled = false;
  stopEl.disabled = true;
}

startEl.addEventListener('click', start);
stopEl.addEventListener('click', () => { stop(); setStatus('stopped'); });
langEl.addEventListener('change', render);

el('ui-lang').addEventListener('click', () => {
  uiLang = uiLang === 'ja' ? 'en' : 'ja';
  try { localStorage.setItem('jev-ui-lang', uiLang); } catch { /* nothing to do */ }
  applyLanguage();
});

el('topic-clear').addEventListener('click', () => {
  selectedTopics.clear();
  saveTopics();
  buildTopicChips();
  render();
});

for (const [id, valId] of [
  ['appeal', 'appeal-val'], ['promo', 'promo-val'],
  ['substance', 'substance-val'], ['langness', 'langness-val'],
  ['interest', 'interest-val'],
]) {
  const input = el(id), out = el(valId);
  input.addEventListener('input', () => {
    out.textContent = parseFloat(input.value).toFixed(2);
    render();
  });
  out.textContent = parseFloat(input.value).toFixed(2);
}

applyLanguage();
loadOptions();
</script>
</body>
</html>
