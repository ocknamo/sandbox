name: jev-mystery CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'jev-mystery/**'
      - '.github/workflows/jev-mystery-ci.yml'
  # Unlike the Cloud Run services this runs on every branch, not just main,
  # so a branch is checked before anyone opens a pull request for it.
  # A branch with a pull request would then be tested twice, once per event;
  # the jobs below skip the pull_request run in that case.
  # The live calls against the real API are not here: they cost tokens on
  # every run, so they live in jev-mystery-live.yml and run only on demand.
  push:
    paths:
      - 'jev-mystery/**'
      - '.github/workflows/jev-mystery-ci.yml'

jobs:
  test:
    name: Build and test
    # A pull request from a branch of this repository was already tested by
    # the push that updated it, so its pull_request run is skipped. Pull
    # requests from forks trigger no push here and still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Runs in well under a minute; nothing here touches the network.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jev-mystery
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

  web:
    name: Web build
    # Skipped on the same pull_request runs as the test job; see there.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # An install and a bundle; well under a minute.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jev-mystery/web
    steps:
      - uses: actions/checkout@v7

      # Pinned, not latest: the bundle is committed, and Bun's output — down
      # to the content hash in the chunk's filename — changes between Bun
      # versions. The pin is what lets the rebuild below be a comparison
      # rather than a coin toss.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: jev-mystery/web/.bun-version

      - name: bun install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bunx tsc --noEmit

      # GitHub Pages serves docs/ straight from the branch, so the bundle is
      # committed rather than built on the way out. Rebuilding it here is what
      # keeps the committed files honest: the build is reproducible, so a
      # difference means somebody changed the source without rebuilding.
      - name: build
        run: bun run build

      - name: The committed bundle matches the source
        working-directory: .
        run: |
          changed=$(git status --porcelain -- docs/mystery)
          if [ -n "$changed" ]; then
            {
              echo '`docs/mystery` is out of date. In `jev-mystery/web`, run'
              echo '`bun run build` with the Bun version in `.bun-version`,'
              echo 'and commit the result.'
              echo
              echo '```text'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$changed"
            exit 1
          fi
