name: jev-mystery Live

# Every run sends the walkthrough twice to the real Jev API, which bills by
# input token, so this does not run on ordinary pushes or pull requests. To
# run it, push the commit to be measured to the jev-mystery-live branch:
#
#   git push -f origin HEAD:jev-mystery-live
#
# There is deliberately no paths filter: whatever lands on that branch is a
# request to measure it, even when the diff against the branch's previous tip
# does not touch jev-mystery/. workflow_dispatch also works once this file is on
# the default branch.
on:
  workflow_dispatch:
  push:
    branches:
      - jev-mystery-live

# A newer push supersedes the one still running; finishing the older run would
# only spend tokens on a commit nobody asked about any more.
concurrency:
  group: jev-mystery-live
  cancel-in-progress: true

jobs:
  live:
    name: Live playthrough
    runs-on: ubuntu-latest
    # One request per line of the walkthrough, plus one to grade the solution.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jev-mystery
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      # The ordinary CI is not a prerequisite of this workflow, so a commit
      # that does not build or pass its tests is stopped here, before it
      # spends anything on the API.
      - name: go test
        run: go test ./...

      # The secrets context is not available in a job-level or step-level `if`,
      # so whether the key exists has to become a step output first. A missing
      # key skips the call rather than failing.
      - name: Look for the API key
        id: key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Live playthrough skipped'
              echo
              echo 'No `TYPESAFE_API_KEY` secret is available to this run.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The tally at the end is what this job exists for: whether the sentences
      # a player would type land on the actions they meant. The run is not
      # failed on it, because the number is the thing being measured and a
      # threshold would only hide it.
      # The output goes to the log as well as the summary, and a failing run
      # fails the step. Collecting it only into the summary hid both the tally
      # this job exists for and the error when there was one, leaving a job
      # that passed without having measured anything.
      - name: Play the walkthrough
        if: steps.key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          {
            echo '### Live playthrough'
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/cli -script testdata/walkthrough.txt -accuse testdata/solution.txt 2>&1 |
            tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Grade a solution that says nothing
        if: steps.key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          {
            echo '### A solution with the name but no reasoning'
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/cli -script testdata/walkthrough.txt -accuse testdata/weak-solution.txt 2>&1 |
            tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
