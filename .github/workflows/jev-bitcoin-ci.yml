name: jev-bitcoin CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'jev-bitcoin/**'
      - '.github/workflows/jev-bitcoin-ci.yml'
  # Unlike the Cloud Run services this runs on every branch, not just main.
  # The live call is the only way to exercise the real API from this repo, and
  # workflow_dispatch is unavailable until the file reaches the default branch.
  # A branch with a pull request would then be tested twice, once per event;
  # the jobs below skip the pull_request run in that case.
  push:
    paths:
      - 'jev-bitcoin/**'
      - '.github/workflows/jev-bitcoin-ci.yml'

jobs:
  test:
    name: Build and test
    # A pull request from a branch of this repository was already tested by
    # the push that updated it, so its pull_request run is skipped. Pull
    # requests from forks trigger no push here and still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Runs in well under a minute; nothing here touches the network.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jev-bitcoin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

  web:
    name: Web build
    # Skipped on the same pull_request runs as the test job; see there.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # An install and a bundle; well under a minute.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jev-bitcoin/web
    steps:
      - uses: actions/checkout@v7

      # Pinned, not latest: the bundle is committed, and Bun's output — down
      # to the content hash in the chunk's filename — changes between Bun
      # versions. The pin is what lets the rebuild below be a comparison
      # rather than a coin toss.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: jev-bitcoin/web/.bun-version

      - name: bun install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bunx tsc --noEmit

      # GitHub Pages serves docs/ straight from the branch, so the bundle is
      # committed rather than built on the way out. Rebuilding it here is what
      # keeps the committed files honest: the build is reproducible, so a
      # difference means somebody changed the source without rebuilding.
      - name: build
        run: bun run build

      - name: The committed bundle matches the source
        working-directory: .
        run: |
          changed=$(git status --porcelain -- docs/bitcoin)
          if [ -n "$changed" ]; then
            {
              echo '`docs/bitcoin` is out of date. In `jev-bitcoin/web`, run'
              echo '`bun run build` with the Bun version in `.bun-version`,'
              echo 'and commit the result.'
              echo
              echo '```text'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$changed"
            exit 1
          fi

  live:
    name: Live queries
    needs: test
    runs-on: ubuntu-latest
    # One request per line of the query file.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jev-bitcoin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      # The secrets context is not available in a job-level or step-level `if`,
      # so whether the key exists has to become a step output first. A missing
      # key skips the call rather than failing: forks and pull requests from
      # them never receive secrets.
      - name: Look for the API key
        id: key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Live queries skipped'
              echo
              echo 'No `TYPESAFE_API_KEY` secret is available to this run.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The tally at the end is what this job exists for: whether the Japanese
      # a reader would type lands on the question they meant. The run is not
      # failed on it, because the number is the thing being measured and a
      # threshold would only hide it. A failing call does fail the step.
      - name: Ask the query file
        if: steps.key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          {
            echo '### Live queries'
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/cli -queries testdata/queries.tsv 2>&1 |
            tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
