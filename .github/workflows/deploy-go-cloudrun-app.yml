name: Deploy go-cloudrun-app

on:
  push:
    branches: [main]
    paths:
      - 'go-cloudrun-app/**'
      - '.github/workflows/deploy-go-cloudrun-app.yml'
      - '.github/workflows/deploy-service.yml'
  workflow_dispatch:

# Required for Workload Identity Federation: the job mints a GitHub OIDC token
# that Google exchanges for short-lived credentials. No service account key.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: go-cloudrun-app
      directory: go-cloudrun-app
