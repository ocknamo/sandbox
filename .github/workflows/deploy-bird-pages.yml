name: Deploy bird front end (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'go-cloudrun-bird/web/**'
      - '.github/workflows/deploy-bird-pages.yml'
  workflow_dispatch:

# configure-pages and deploy-pages authenticate with an OIDC token, the same way
# the Cloud Run deploys do. No secrets, no gh-pages branch to keep in order.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer commit replaces a queued one: only the latest
# version of a static page is worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Copying one file and uploading it takes seconds.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the static site
        # Only the browser files. web/ also holds the Go source that embeds the
        # page into the API binary, which has no business being published.
        run: |
          mkdir -p _site
          cp go-cloudrun-bird/web/index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: echo "Published ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
