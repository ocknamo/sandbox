name: go-cloudrun-app CI

on:
  pull_request:
    paths:
      - 'go-cloudrun-app/**'
      - '.github/workflows/go-cloudrun-ci.yml'
  push:
    branches: [main]
    paths:
      - 'go-cloudrun-app/**'
      - '.github/workflows/go-cloudrun-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-cloudrun-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...
