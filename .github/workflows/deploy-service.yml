# Reusable deployment for one Cloud Run service in this repository.
# Callers live in deploy-<service>.yml and supply the service name and directory;
# everything else (project, WIF provider, service accounts) comes from repository
# variables shared by every service.
name: Deploy service

on:
  workflow_call:
    inputs:
      service:
        description: Cloud Run service name, also used as the image name.
        required: true
        type: string
      directory:
        description: Directory holding the service's source and Dockerfile.
        required: true
        type: string
      runtime_sa:
        description: >-
          Runtime service account for this service. Defaults to the shared
          GCP_RUNTIME_SA variable; override to give a service its own identity.
        required: false
        default: ''
        type: string
      region:
        required: false
        default: asia-northeast1
        type: string
      ar_repo:
        description: Artifact Registry repository holding every service's images.
        required: false
        default: apps
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Build, push, deploy and smoke test take about two minutes; well short of
    # this, but bounded so a hung step cannot sit on a runner for six hours.
    timeout-minutes: 20
    # Keyed by service so deployments of different services never queue behind
    # one another, while repeated pushes to the same service still serialize.
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ inputs.service }}
      REGION: ${{ inputs.region }}
      AR_REPO: ${{ inputs.ar_repo }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required repository variables
        run: |
          missing=""
          [ -n "${{ vars.GCP_PROJECT_ID }}" ]   || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] || missing="$missing GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_DEPLOY_SA }}" ]    || missing="$missing GCP_DEPLOY_SA"
          [ -n "${{ vars.GCP_RUNTIME_SA }}" ]   || missing="$missing GCP_RUNTIME_SA"
          if [ -n "$missing" ]; then
            echo "Missing repository variables:$missing"
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            echo "go-cloudrun-app/scripts/setup-gcp.sh prints the exact values to use."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: go test
        run: go test ./...

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        id: build
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$AR_REPO/$SERVICE:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --image="${{ steps.build.outputs.image }}" \
            --region="$REGION" \
            --service-account="${{ inputs.runtime_sa || vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=256Mi \
            --cpu=1 \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployed revision
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "health OK"
              curl -s --max-time 20 "$URL/"
              echo "### Deployed \`$SERVICE\`: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i: got $code, retrying"
            sleep 5
          done
          echo "Service did not become healthy at $URL"
          # Dump the final response so the failure is diagnosable from the log:
          # a body from Google Front End rather than the app means the request
          # never reached the container.
          curl -s -i --max-time 20 "$URL/health" | head -30
          exit 1
