name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'go-cloudrun-app/**'
      - '.github/workflows/deploy-cloudrun.yml'
  workflow_dispatch:

# Required for Workload Identity Federation: the job mints a GitHub OIDC token
# that Google exchanges for short-lived credentials. No service account key.
permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  SERVICE: go-cloudrun-app
  AR_REPO: apps

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-cloudrun-app
    steps:
      - uses: actions/checkout@v4

      - name: Check required repository variables
        run: |
          missing=""
          [ -n "${{ vars.GCP_PROJECT_ID }}" ]   || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] || missing="$missing GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_DEPLOY_SA }}" ]    || missing="$missing GCP_DEPLOY_SA"
          [ -n "${{ vars.GCP_RUNTIME_SA }}" ]   || missing="$missing GCP_RUNTIME_SA"
          if [ -n "$missing" ]; then
            echo "Missing repository variables:$missing"
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            echo "scripts/setup-gcp.sh prints the exact values to use."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: go test
        run: go test ./...

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        id: build
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$AR_REPO/$SERVICE:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --image="${{ steps.build.outputs.image }}" \
            --region="$REGION" \
            --service-account="${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=256Mi \
            --cpu=1 \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployed revision
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "healthz OK"
              curl -s "$URL/"
              echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i: got $code, retrying"
            sleep 5
          done
          echo "Service did not become healthy at $URL"
          exit 1
