name: jev-nostr CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'jev-nostr/**'
      - '.github/workflows/jev-nostr-ci.yml'
  # Unlike the Cloud Run services this runs on every branch, not just main,
  # so a branch is checked before anyone opens a pull request for it.
  # A branch with a pull request would then be tested twice, once per event;
  # the jobs below skip the pull_request run in that case.
  # The live calls against the real API are not here: they cost tokens on
  # every run, so they live in jev-nostr-live.yml and run only on demand.
  push:
    paths:
      - 'jev-nostr/**'
      - '.github/workflows/jev-nostr-ci.yml'

jobs:
  test:
    name: Build and test
    # A pull request from a branch of this repository was already tested by
    # the push that updated it, so its pull_request run is skipped. Pull
    # requests from forks trigger no push here and still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Runs in well under a minute; nothing here touches the network.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jev-nostr
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...
